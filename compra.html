    <main>
        <section class="d-flex justify-content-center">
            <div id="detalle" class="container row bg-light p-3 rounded"></div>
        </section>

    <section class="container justify-content-center">
  <form id="formulario" action="https://formspree.io/f/xovwyopp" method="POST" class="w-100 px-3">
    
    <!-- Datos ocultos -->
    <textarea id="carritoData" name="carrito" style="display:none;"></textarea>
    <textarea id="totalCarrito" name="total" style="display:none;"></textarea>
    
    <hr>

    <!-- Fila de inputs -->
    <div class="row mb-3">
      <div class="col-md-4 mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" class="form-control" required>
      </div>

      <div class="col-md-4 mb-3">
        <label for="contactoEmail" class="form-label">Email</label>
        <input type="email" id="contactoEmail" name="email" placeholder="Correo electrónico" class="form-control" required>
      </div>

      <div class="col-md-4 mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" class="form-control">
      </div>
    </div>

    <!-- Botón -->
    <div class="row">
      <div class="col text-center">
        <button type="submit" id="botonEnviar" class="btn btn-secondary">
          Confirmar Compra
        </button>
      </div>
    </div>

  </form>
</section>
