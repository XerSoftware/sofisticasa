    <section class="container-fluid">
       <section id="contacto">
            <form action="https://formspree.io/f/xldjwzrl" method="post">
                
                <div class="item">
                    <label>Nombre: </label>
                    <input type="text">
                </div>
                <div class="item zona">
                    <label>Zona donde resides: </label>
                    <select name="zona">
                        <option value="">Otra</option>
                        <option value="zona_sur">Zona Norte Buenos Aires</option>
                        <option value="caba">Ciudad de Buenos Aires</option>
                        <option value="zona_norte">Zona Sur Buenos Aires</option>
                    </select>
                </div>
                <div class="item email">
                    <label>Tu Email: </label>
                    <input type="email" name="email" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" required="True" placeholder="maria@gmail.com">
                </div>
                <div class="item mensaje">
                <label>Mensaje: </label>
                    <textarea class="text_area" cols="22" rows="20" name="mensaje"></textarea>
                </div>
                <div class="item">
                <label id="contacto-motivo">Estoy interesado en: </label>
                    <select name="interes">
                        <option value="">Seleccione una opción</option>
                        <option value="vajilla">Vajilla</option>
                        <option value="velas">Velas</option>
                        <option value="ceramicas">Cerámicas</option>
                    </select>
                </div>
                <div class="item boton">
                    <button type="submit">Enviar</button>
                </div>
            </form>
            <div class="mas_datos">
